name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled: cancelling a main run part way
  # through publishing could leave a pushed image unsigned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/thalovant/hivemind-mattermost-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # --pre: the floors name alphas (hivemind-bus-client>=1.0.16a1).
        # e2e: tests/e2e runs the bridge against a real loopback hub.
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e ".[test,e2e]" ruff
      - name: Lint (undefined names, unused imports, syntax errors)
        run: ruff check --isolated --select F,E9 .
      - name: Run tests
        run: python -m pytest tests -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --pull -t "${IMAGE_NAME}:ci-smoke-${GITHUB_SHA}" .
      - name: The image starts the bridge as an unprivileged user
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:ci-smoke-${GITHUB_SHA}"
          # The entrypoint is the bridge itself: --help answers and exits 0.
          # (Into a file: grep -q stops reading early, and under pipefail the
          # writer's broken pipe would fail the step.)
          docker run --rm "$image" --help > help.txt 2>&1 || { cat help.txt; exit 1; }
          grep -q -- "--health-port" help.txt || { echo "no --health-port in --help:"; cat help.txt; exit 1; }
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$uid" = "10001" || { echo "the image runs as uid $uid, not 10001"; exit 1; }
          # With no token anywhere the bridge refuses to start, naming the variable.
          if docker run --rm --read-only -e MATTERMOST_URL=https://chat.example.com "$image" > out.txt 2>&1; then
            echo "started without a token"; cat out.txt; exit 1
          fi
          grep -q "MATTERMOST_TOKEN" out.txt || { echo "the refusal does not name MATTERMOST_TOKEN:"; cat out.txt; exit 1; }
      - name: The bridge starts on a read-only root, its identity where the platform mounts it
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:ci-smoke-${GITHUB_SHA}"
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/bridge/.config/hivemind:mode=1777 \
            --entrypoint python "$image" -c '
          from mattermost_bridge import HiveMindMattermostBridge
          bridge = HiveMindMattermostBridge(url="https://chat.example.com", token="t", key="k",
                                            password="p", host="ws://127.0.0.1")
          path = bridge.client.identity.noise_key
          assert path == "/home/bridge/.config/hivemind/unnamed-node_noise.key", path
          print("noise key:", path)'

  integration:
    # The image against a real Mattermost server (mattermost-preview, pinned
    # by digest) and a real loopback hub: tests/integration/README.md.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e ".[e2e]"
      - name: Run against a real Mattermost server
        env:
          CONTAINER_ENGINE: docker
          PYTHON: python
          MATTERMOST_IMAGE: docker.io/mattermost/mattermost-preview@sha256:368d0e87c0a981b2ce60d42f95a914f132be4e190ce202b7723ecf22266dc234
        run: tests/integration/run.sh

  image:
    runs-on: ubuntu-latest
    needs: [test, smoke, integration]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this short-lived OIDC token for a
      # Fulcio certificate, so nothing here holds a key that could leak.
      id-token: write
    env:
      # Publish from main only. A pull request, or a manual run on another
      # branch, builds the image and stops there.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push under the commit's tag only
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          # :latest is added only after the digest is signed and verified, so
          # it never points at an unsigned image.
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign the pushed digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify the signature, as an admission controller would
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}" > /dev/null
      - name: Move :latest to the verified digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${DIGEST}"
          echo "published and verified: ${IMAGE_NAME}@${DIGEST} (:sha-${GITHUB_SHA}, :latest)"
